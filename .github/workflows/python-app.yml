name: Daily Job

on:
  schedule:
    # GitHub cron 使用 UTC：15:55 UTC = 中国时间 23:55。
    - cron: '55 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  run-python-script:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install -r requirements.txt
        
    - name: Run Python script
      run: |
        python monitor.py
